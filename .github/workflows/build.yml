name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22
      - uses: actions/configure-pages@v6
      - name: Run build
        run: |
          npm ci --no-audit
          npm run build
      - name: Check generated reference is committed
        run: |
          generated="docs-next/reference/_generated static/lineup static/channel static/playout"
          if [ -n "$(git status --porcelain -- $generated)" ]; then
            git status --porcelain -- $generated
            echo "::error::generated next reference is out of date; run npm run generate-next-reference and commit"
            exit 1
          fi
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy to GitHub Pages
    concurrency: build-deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
